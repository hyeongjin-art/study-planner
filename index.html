<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>형진의 자격증 플래너</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Design tokens — 형진의 스터디 플래너 design system ── */
:root {
  --bg-canvas:    #0D1117;
  --bg-surface:   #161B22;
  --bg-surface-2: #1C2433;
  --border:       #21262D;
  --fg-default:   #E6EDF3;
  --fg-sub:       #C9D1D9;
  --fg-muted:     #6E7681;
  --blue:         #58A6FF;
  --blue-bright:  #79C0FF;
  --green:        #3FB950;
  --green-emerald:#34D399;
  --amber:        #FBBF24;
  --amber-deep:   #F59E0B;
  --red:          #F87171;
  --pink:         #F9A8D4;
  --track-toeic:  #60A5FA;
  --track-sajobn: #34D399;
  --track-aice:   #FBBF24;
  --tint-blue:    #0D1B2A;
  --tint-amber:   #1C0A00;
  --tint-amber-2: #1A1A0A;
  --tint-amber-3: #120F00;
  --tint-green:   #0A2A18;
  --tint-streak:  #0F0800;
  --border-amber: #92400E55;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background: var(--bg-canvas);
  color: var(--fg-default);
  font-family: 'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
textarea:focus { border-color: var(--blue) !important; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background: var(--bg-canvas); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }
.wrap { max-width: 480px; margin: 0 auto; }

/* full-screen states (loading / login) */
.screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-box { max-width:340px; width:100%; text-align:center; }
.google-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:15px 20px; border-radius:10px; border:1px solid var(--border); background:var(--bg-surface); color:var(--fg-default); font-size:15px; font-weight:700; cursor:pointer; transition:background .15s; }
.google-btn:disabled { opacity:.6; cursor:not-allowed; }

/* header */
.hdr { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 18px 18px 0; }
.hdr-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.hdr-date { margin:0; font-size:11px; color:var(--fg-muted); }
.hdr-title { margin:3px 0 0; font-size:20px; font-weight:800; letter-spacing:-0.5px; }
.hdr-badges { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.badge-streak { background:var(--tint-amber); border:1px solid var(--border-amber); border-radius:20px; padding:4px 12px; font-size:13px; color:var(--amber); font-weight:700; }
.badge-next { background:var(--tint-blue); border-radius:20px; padding:4px 12px; font-size:11px; font-weight:600; }

/* progress */
.prog-row { display:flex; justify-content:space-between; margin-bottom:5px; }
.prog-track { background:var(--border); border-radius:999px; height:5px; overflow:hidden; }
.prog-fill { height:100%; border-radius:999px; transition:width .4s ease; }

/* tabs */
.tabs { display:flex; }
.tabbtn { flex:1; padding:10px 0; background:transparent; border:none; cursor:pointer; font-size:13px; font-weight:400; color:var(--fg-muted); border-bottom:2px solid transparent; transition:all .2s; }
.tabbtn.active { font-weight:700; color:var(--blue); border-bottom-color:var(--blue); }

/* body */
.body { padding: 18px 16px 56px; }
.card { background:var(--bg-surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; }

/* segment toggle */
.seg-row { display:flex; gap:8px; margin-bottom:14px; }
.segbtn { padding:10px 16px; border-radius:10px; cursor:pointer; border:none; font-size:13px; font-weight:500; background:var(--bg-surface); color:var(--fg-muted); outline:1px solid var(--border); transition:all .2s; display:flex; align-items:center; gap:8px; }
.segbtn .cnt { margin-left:auto; border-radius:999px; padding:1px 7px; font-size:11px; font-weight:700; background:var(--border); color:var(--fg-muted); }
.segbtn .cnt.full { background:var(--green); color:var(--bg-canvas); }

/* eyebrow divider */
.eyebrow { display:flex; align-items:center; margin-bottom:8px; }
.eyebrow > span { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
.eyebrow .line { height:1px; background:var(--border); flex:1; margin-left:8px; }

/* task */
.task { cursor:pointer; margin-bottom:8px; }
.task-row { display:flex; align-items:center; gap:12px; }
.chk { width:22px; height:22px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; border:2px solid var(--border); background:transparent; }
.task-label { font-size:14px; color:var(--fg-default); }
.task.done .task-label { color:var(--fg-muted); text-decoration:line-through; }

/* heatmap */
.heat { display:flex; gap:4px; justify-content:space-between; }
.heat-col { text-align:center; flex:1; min-width:0; }
.heat-day { font-size:10px; color:var(--fg-muted); margin-bottom:4px; }
.heat-cell { height:28px; border-radius:6px; border:2px solid transparent; display:flex; align-items:center; justify-content:center; }
.heat-pct { font-size:9px; color:var(--fg-muted); margin-top:3px; height:12px; }

/* memo */
.memo { width:100%; min-height:88px; background:var(--bg-surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--fg-sub); font-size:13px; resize:vertical; outline:none; font-family:inherit; line-height:1.7; }
.memo::placeholder { color:var(--fg-muted); }

/* calendar */
.cal-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.cal-navbtn { background:var(--border); border:none; color:var(--fg-default); border-radius:8px; width:36px; height:36px; cursor:pointer; font-size:18px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
.cal-dayname { text-align:center; padding:9px 0; font-size:12px; font-weight:600; background:var(--border); color:var(--fg-muted); }
.cal-cell { min-height:46px; border-top:1px solid var(--border); padding:5px 3px; }
.cal-num { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:13px; }
.cal-chip { font-size:9px; border-radius:3px; padding:1px 3px; margin-top:2px; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; line-height:1.4; }
.legend { display:flex; gap:12px; margin-top:8px; justify-content:center; }
.legend-item { display:flex; align-items:center; gap:5px; }
.legend-swatch { width:12px; height:12px; border-radius:3px; }

/* logout */
.logout-btn { background:transparent; border:1px solid var(--border); color:var(--fg-muted); border-radius:8px; padding:8px 20px; cursor:pointer; font-size:12px; }
</style>
</head>
<body>
<div id="app"><div class="screen"><p style="color:#6E7681;font-size:14px;">불러오는 중…</p></div></div>
<script>
/* ════════════════════════════════════════════════════════════
   형진의 자격증 플래너 — single-file build
   Logic from uploads/study-planner.jsx (design-system source of
   truth). Storage: Firestore (users/{uid}/days, users/{uid}/memos
   — same schema as the previous deployment, so existing history
   is preserved) with Google sign-in; falls back to localStorage
   when opened directly from disk (file://).
   ════════════════════════════════════════════════════════════ */

const firebaseConfig = {
  apiKey:            "AIzaSyALPXchQjFPnef8RPDCA0BSKMnJ5dh2vVA",
  authDomain:        "studyplan-6d3ac.firebaseapp.com",
  projectId:         "studyplan-6d3ac",
  storageBucket:     "studyplan-6d3ac.firebasestorage.app",
  messagingSenderId: "76851932451",
  appId:             "1:76851932451:web:45e91b648bad2473adb096"
};
const IS_LOCAL = location.protocol === "file:" || typeof firebase === "undefined";

/* ── CONSTANTS ── */
const todayDate = new Date();
const pad2 = n => String(n).padStart(2,"0");
const localDateStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr = localDateStr(todayDate);
const tomorrowDate = new Date(todayDate); tomorrowDate.setDate(tomorrowDate.getDate()+1);
const tomorrowStr = localDateStr(tomorrowDate);
const STORE = "hyeongjin";
const DAY_NAMES = ["일","월","화","수","목","금","토"];

const AICE_EXAM    = "2026-06-27";
const SAJOBN_APPLY = "2026-07-20";
const SAJOBN_EXAM  = "2026-08-07";

const TOEIC_TASKS = {
  weekday: { id:"toeic_daily", label:"토익 60분: 단어 20개 + LC/RC 1세트", cat:"toeic" },
  weekend: { id:"toeic_daily", label:"토익 60분: 단어 복습 + 실전 파트 1개", cat:"toeic" },
};
const AICE_TASKS = {
  foundation: { id:"aice_daily", label:"AICE 120분: 이론 1강 + 예제 코드 따라치기", cat:"aice" },
  practice:   { id:"aice_daily", label:"AICE 120분: 실습 문제 풀이 + 오답 코드 재작성", cat:"aice" },
  final:      { id:"aice_daily", label:"AICE 120분: 모의 실습 1회 + 약점 노트 정리", cat:"aice" },
  exam:       { id:"aice_daily", label:"AICE 시험일: 핵심 노트 30분만 훑고 컨디션 유지", cat:"aice" },
};
const SAJOBN_TASKS = {
  intro:    { id:"sajobn_daily", label:"사조분 120분: 조사방법론 핵심 강의 + 개념 노트", cat:"sajobn" },
  theory:   { id:"sajobn_daily", label:"사조분 120분: 사회통계/조사방법론 진도 + 예제", cat:"sajobn" },
  apply:    { id:"sajobn_daily", label:"사조분 접수일: 원서접수 완료 + 기출 20문항", cat:"sajobn" },
  problems: { id:"sajobn_daily", label:"사조분 120분: 기출 40문항 + 오답 정리", cat:"sajobn" },
  final:    { id:"sajobn_daily", label:"사조분 120분: 모의고사 1회분 + 빈출 공식 암기", cat:"sajobn" },
  exam:     { id:"sajobn_daily", label:"사조분 시험일: 오답노트와 공식만 가볍게 복습", cat:"sajobn" },
};
const MILESTONES = [
  { date:"2026-06-27", label:"AICE 자격 시험",        short:"AICE",     color:"#FBBF24" },
  { date:"2026-07-20", label:"사조분 3회차 원서접수",  short:"원서접수", color:"#F59E0B" },
  { date:"2026-08-07", label:"사회조사분석사 2급 시험", short:"사조분",   color:"#34D399" },
];
const PHASES = {
  6: { label:"AICE 집중기",   desc:"토익 60분 고정 · AICE 120분으로 시험 전까지 몰입" },
  7: { label:"사조분 전환기", desc:"토익 60분 고정 · 사조분 120분, 7월 20일 접수 확인" },
  8: { label:"사조분 실전기", desc:"토익 60분 고정 · 8월 7일 시험 전 기출과 오답 압축" },
};
const CAT_META = {
  toeic:  { label:"토익",   accent:"#60A5FA" },
  sajobn: { label:"사조분", accent:"#34D399" },
  aice:   { label:"AICE",   accent:"#FBBF24" },
};
const C = { bg:"#0D1117", surface:"#161B22", border:"#21262D", muted:"#6E7681", text:"#E6EDF3", sub:"#C9D1D9", blue:"#58A6FF", green:"#3FB950", amber:"#FBBF24" };

/* ── HELPERS ── */
const toDateStr  = d => d instanceof Date ? localDateStr(d) : d;
const dateNum    = d => new Date(`${toDateStr(d)}T00:00:00`).getTime();
const isWE       = d => [0,6].includes(d instanceof Date ? d.getDay() : new Date(`${d}T00:00:00`).getDay());
const pickToeic  = d => isWE(d) ? TOEIC_TASKS.weekend : TOEIC_TASKS.weekday;
const pickAice   = d => {
  const ds = toDateStr(d);
  if (ds === AICE_EXAM) return AICE_TASKS.exam;
  if (dateNum(ds) >= dateNum("2026-06-24")) return AICE_TASKS.final;
  if (dateNum(ds) >= dateNum("2026-06-18")) return AICE_TASKS.practice;
  return AICE_TASKS.foundation;
};
const pickSajobn = d => {
  const ds = toDateStr(d);
  if (ds === SAJOBN_EXAM)  return SAJOBN_TASKS.exam;
  if (ds === SAJOBN_APPLY) return SAJOBN_TASKS.apply;
  if (dateNum(ds) >= dateNum("2026-08-01")) return SAJOBN_TASKS.final;
  if (dateNum(ds) >= dateNum("2026-07-21")) return SAJOBN_TASKS.problems;
  if (dateNum(ds) >= dateNum("2026-07-08")) return SAJOBN_TASKS.theory;
  return SAJOBN_TASKS.intro;
};
const getTasks  = d => [pickToeic(d), dateNum(d) <= dateNum(AICE_EXAM) ? pickAice(d) : pickSajobn(d)];
const getDIM    = (y,m) => new Date(y,m+1,0).getDate();
const getFirst  = (y,m) => new Date(y,m,1).getDay();
const daysUntil = ds => Math.ceil((dateNum(ds)-dateNum(todayStr))/86400000);
const fmtDate   = ds => new Date(`${ds}T00:00:00`).toLocaleDateString("ko-KR",{month:"long",day:"numeric"});
const padDate   = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;
const esc       = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function calcStreak(days) {
  let n = 0;
  let d = new Date(`${todayStr}T00:00:00`);
  const todayData  = days[todayStr];
  const todayTasks = getTasks(d);
  const todayFull  = todayData && todayTasks.every(t => todayData[t.id]);
  if (!todayFull) d.setDate(d.getDate()-1);
  for (let i=0;i<365;i++) {
    const ds   = localDateStr(d);
    const data = days[ds];
    if (!data) break;
    if (getTasks(d).every(t => data[t.id])) { n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return { streak:n, todayFull };
}

/* ── STORAGE ADAPTERS ── */
function localAdapter() {
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const set = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
  return {
    async loadDays() {
      const days = {};
      try {
        for (let i=0;i<localStorage.length;i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(`${STORE}:`) && !k.includes(":memo:") && /:\d{4}-\d{2}-\d{2}$/.test(k)) {
            try { days[k.slice(STORE.length+1)] = JSON.parse(localStorage.getItem(k)); } catch {}
          }
        }
      } catch {}
      return days;
    },
    async getMemo(ds) { return get(`${STORE}:memo:${ds}`) || ""; },
    setDay(ds, data)  { set(`${STORE}:${ds}`, JSON.stringify(data)); },
    setMemo(ds, text) { set(`${STORE}:memo:${ds}`, text); },
  };
}
function firestoreAdapter(uid) {
  const db = firebase.firestore();
  return {
    async loadDays() {
      const days = {};
      const snap = await db.collection(`users/${uid}/days`).get();
      snap.forEach(d => { days[d.id] = d.data(); });
      return days;
    },
    async getMemo(ds) {
      const doc = await db.collection(`users/${uid}/memos`).doc(ds).get();
      return doc.exists ? doc.data().text : "";
    },
    setDay(ds, data)  { db.collection(`users/${uid}/days`).doc(ds).set(data).catch(()=>{}); },
    setMemo(ds, text) { db.collection(`users/${uid}/memos`).doc(ds).set({ text }).catch(()=>{}); },
  };
}
let store = null;

/* ── STATE ── */
const state = {
  screen: "loading",      // loading | login | app
  user: null,
  loginError: "",
  signingIn: false,
  tab: "today",
  viewOffset: 0,
  calYear: todayDate.getFullYear(),
  calMonth: todayDate.getMonth(),
  allDays: {},
  checked: {},
  tomorrowChecked: {},
  memo: "",
  tomorrowMemo: "",
};

const mergedDays = () => ({...state.allDays, [todayStr]:state.checked, [tomorrowStr]:state.tomorrowChecked});

/* ── STATS ── */
function computeStats(merged) {
  const {streak, todayFull} = calcStreak(merged);
  const dots = [];
  for (let i=6;i>=0;i--) {
    const d = new Date(`${todayStr}T00:00:00`);
    d.setDate(d.getDate()-i);
    const ds   = localDateStr(d);
    const data = merged[ds];
    const t    = getTasks(d);
    const p    = data ? Math.round((t.filter(x=>data[x.id]).length/t.length)*100) : 0;
    dots.push({ds, pct:p, day:DAY_NAMES[d.getDay()], isToday:i===0});
  }
  let totalToeic=0, totalSj=0, totalAice=0, totalFull=0, monthFull=0;
  const monthPrefix = `${todayDate.getFullYear()}-${pad2(todayDate.getMonth()+1)}`;
  for (const [ds,data] of Object.entries(merged)) {
    if (!data) continue;
    const t = getTasks(ds);
    const full = t.every(x=>data[x.id]);
    if (full) totalFull++;
    if (full && ds.startsWith(monthPrefix)) monthFull++;
    if (data.toeic_daily||data.vocab||data.grammar||data.toeic_mock) totalToeic++;
    if (data.sajobn_daily||data.sj_lec||data.sj_note||data.sj_quiz)  totalSj++;
    if (data.aice_daily||data.aice_lec||data.aice_code||data.aice_review) totalAice++;
  }
  const next = MILESTONES.filter(m=>daysUntil(m.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
  return {streak, todayFull, dots, totalToeic, totalSj, totalAice, totalFull, monthFull, next};
}

/* ── ACTIONS ── */
function toggleTask(id) {
  if (state.viewOffset === 0) {
    state.checked = {...state.checked, [id]:!state.checked[id]};
    store.setDay(todayStr, state.checked);
  } else {
    state.tomorrowChecked = {...state.tomorrowChecked, [id]:!state.tomorrowChecked[id]};
    store.setDay(tomorrowStr, state.tomorrowChecked);
  }
  render();
}
let memoTimer = null;
function saveMemo(val) {
  const viewDateStr = state.viewOffset===0 ? todayStr : tomorrowStr;
  if (state.viewOffset === 0) state.memo = val; else state.tomorrowMemo = val;
  clearTimeout(memoTimer);
  memoTimer = setTimeout(()=>store.setMemo(viewDateStr, val), 800);
}
async function signIn() {
  state.signingIn = true; state.loginError = ""; render();
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await firebase.auth().signInWithPopup(provider);
  } catch(e) {
    state.loginError = e.code === "auth/popup-closed-by-user" ? "로그인 창이 닫혔어요. 다시 시도해주세요." : "로그인 실패: " + e.message;
    state.signingIn = false; render();
  }
}
async function boot(adapter, user) {
  store = adapter;
  state.user = user;
  state.allDays = await adapter.loadDays();
  state.checked = state.allDays[todayStr] || {};
  state.tomorrowChecked = state.allDays[tomorrowStr] || {};
  state.memo = await adapter.getMemo(todayStr);
  state.tomorrowMemo = await adapter.getMemo(tomorrowStr);
  state.screen = "app";
  render();
}

/* ── RENDER: LOADING / LOGIN ── */
function renderLoading() {
  return `<div class="screen"><p style="color:${C.muted};font-size:14px;">불러오는 중…</p></div>`;
}
function renderLogin() {
  return `<div class="screen"><div class="login-box">
    <div style="font-size:52px;margin-bottom:16px;">📚</div>
    <h1 style="color:${C.text};font-size:22px;font-weight:800;margin:0 0 6px;">형진의 자격증 플래너</h1>
    <p style="color:${C.muted};font-size:13px;margin:0 0 10px;">Google 계정으로 로그인하면</p>
    <p style="color:${C.muted};font-size:13px;margin:0 0 32px;">PC · 폰 어디서든 체크 기록이 동기화됩니다</p>
    <button class="google-btn" data-act="signin" ${state.signingIn?"disabled":""}>
      ${state.signingIn ? "로그인 중…" : `<svg width="18" height="18" viewBox="0 0 18 18">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg> Google로 로그인`}
    </button>
    ${state.loginError ? `<p style="color:#F87171;font-size:12px;margin-top:12px;">${esc(state.loginError)}</p>` : ""}
  </div></div>`;
}

/* ── RENDER: TODAY TAB ── */
function renderToday(stats, view) {
  const {viewChecked, tasks, done, phase, isWeekend} = view;
  let html = "";

  /* 오늘/내일 토글 */
  html += `<div class="seg-row">`;
  for (const offset of [0,1]) {
    const isActive = state.viewOffset===offset;
    const d   = offset===0 ? todayDate : tomorrowDate;
    const t   = getTasks(d);
    const c   = offset===0 ? state.checked : state.tomorrowChecked;
    const cnt = t.filter(x=>c[x.id]).length;
    const full = cnt===t.length;
    const accent = offset===1 ? C.amber : C.blue;
    const style = isActive
      ? `flex:${offset===0?"0 0 auto":"1"};background:${offset===1?"#1A1A0A":"#1C2433"};color:${accent};outline:2px solid ${accent};font-weight:700;`
      : `flex:${offset===0?"0 0 auto":"1"};`;
    html += `<button class="segbtn" data-act="offset" data-offset="${offset}" style="${style}">`
      + (offset===1 ? `<span style="font-size:14px">⏩</span>` : "")
      + (offset===0 ? "오늘" : "내일 미리 하기")
      + (cnt>0 ? `<span class="cnt${full?" full":""}">${full?"완료":`${cnt}/${t.length}`}</span>` : "")
      + `</button>`;
  }
  html += `</div>`;

  /* 내일 미리하기 배너 */
  if (state.viewOffset===1) {
    html += `<div class="card" style="border-color:${C.amber}44;background:#120F00;margin-bottom:14px;">
      <p style="margin:0;font-size:13px;color:${C.amber};font-weight:700;">⏩ ${tomorrowDate.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"})} 분량 미리 하는 중</p>
      <p style="margin:4px 0 0;font-size:12px;color:${C.muted};">체크한 항목은 저장되고, 내일 앱을 열면 반영돼 있어요</p>
    </div>`;
  }

  /* 페이즈 + 주간 히트맵 */
  html += `<div class="card">
    <div style="margin-bottom:12px;">
      <span style="font-size:11px;color:${C.muted};">${isWeekend?"🌅 주말 2트랙":"📅 평일 2트랙"} · <span style="color:${state.viewOffset===1?C.amber:C.blue};font-weight:700;">${phase.label}</span></span>
      <p style="margin:3px 0 0;font-size:13px;color:${C.sub};">${phase.desc}</p>
    </div>
    <div class="heat">`;
  for (const dot of stats.dots) {
    const bg = dot.pct===0 ? C.border : dot.pct===100 ? C.green : `rgba(88,166,255,${(0.15+dot.pct/100*0.85).toFixed(3)})`;
    html += `<div class="heat-col">
      <div class="heat-day" style="${dot.isToday?`color:${C.blue};font-weight:700;`:""}">${dot.day}</div>
      <div class="heat-cell" style="background:${bg};${dot.isToday?`border-color:${C.blue};`:""}">${dot.pct===100?`<span style="font-size:11px">✓</span>`:""}</div>
      <div class="heat-pct">${dot.pct>0&&dot.pct<100?dot.pct+"%":""}</div>
    </div>`;
  }
  html += `</div></div>`;

  /* 트랙별 태스크 */
  for (const [cat,meta] of Object.entries(CAT_META)) {
    const list = tasks.filter(t=>t.cat===cat);
    if (!list.length) continue;
    html += `<div style="margin-bottom:16px;">
      <div class="eyebrow"><span style="color:${meta.accent};">${meta.label}</span><div class="line"></div></div>`;
    for (const t of list) {
      const chk = !!viewChecked[t.id];
      html += `<div class="card task${chk?" done":""}" data-act="toggle" data-id="${t.id}" style="${chk?`border-color:${meta.accent}44;`:""}">
        <div class="task-row">
          <div class="chk" style="${chk?`border-color:${meta.accent};background:${meta.accent};`:""}">${chk?`<span style="font-size:12px;color:${C.bg};font-weight:700;">✓</span>`:""}</div>
          <span class="task-label">${esc(t.label)}</span>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  /* 완료 메시지 */
  if (done===tasks.length) {
    html += `<div style="text-align:center;padding:16px 0 8px;">
      <p style="margin:0;color:${C.green};font-weight:700;font-size:15px;">🎉 ${state.viewOffset===0?"오늘":"내일"} 3시간 플랜 완료!</p>
      <p style="margin:4px 0 0;color:${C.muted};font-size:13px;">토익 + 집중 과목, 딱 두 가지만 끝냈어요</p>
    </div>`;
  }

  /* 메모 */
  const memoVal = state.viewOffset===0 ? state.memo : state.tomorrowMemo;
  html += `<div style="margin-top:8px;">
    <div class="eyebrow"><span style="color:${C.muted};text-transform:none;">📝 ${state.viewOffset===0?"오늘":"내일"}의 메모</span><div class="line"></div></div>
    <textarea id="memoInput" class="memo" placeholder="진도, 어려웠던 것, 내일 할 일 등 자유롭게 기록해요…">${esc(memoVal)}</textarea>
  </div>`;
  return html;
}

/* ── RENDER: CALENDAR TAB ── */
function renderCalendar(merged) {
  const {calYear, calMonth} = state;
  let html = `<div class="cal-nav">
    <button class="cal-navbtn" data-act="prev">‹</button>
    <span style="font-weight:700;font-size:16px;">${calYear}년 ${calMonth+1}월</span>
    <button class="cal-navbtn" data-act="next">›</button>
  </div>`;

  if (PHASES[calMonth+1]) {
    html += `<div class="card">
      <span style="color:${C.blue};font-weight:700;font-size:13px;">${calMonth+1}월 — ${PHASES[calMonth+1].label}</span>
      <p style="margin:4px 0 0;color:${C.muted};font-size:12px;">${PHASES[calMonth+1].desc}</p>
    </div>`;
  }

  html += `<div class="cal-card"><div class="cal-grid">`;
  DAY_NAMES.forEach((d,i)=>{
    const col = i===0 ? "#F87171" : i===6 ? C.blue : C.muted;
    html += `<div class="cal-dayname" style="color:${col};">${d}</div>`;
  });
  html += `</div><div class="cal-grid">`;
  for (let i=0;i<getFirst(calYear,calMonth);i++) html += `<div class="cal-cell"></div>`;
  for (let i=0;i<getDIM(calYear,calMonth);i++) {
    const d   = i+1;
    const ds  = padDate(calYear,calMonth,d);
    const isT = ds===todayStr;
    const dow = new Date(calYear,calMonth,d).getDay();
    const ms  = MILESTONES.filter(m=>m.date===ds);
    const data = merged[ds];
    const dt   = getTasks(new Date(calYear,calMonth,d));
    const full = data && dt.every(t=>data[t.id]);
    const numStyle = isT
      ? `font-weight:700;background:${C.blue};color:${C.bg};`
      : full ? `background:#0A2A18;color:${C.green};`
      : `color:${dow===0?"#F87171":dow===6?C.blue:C.text};`;
    html += `<div class="cal-cell" style="${isT?"background:#1C2433;":""}">
      <div class="cal-num" style="${numStyle}">${d}</div>`;
    for (const m of ms) html += `<div class="cal-chip" style="background:${m.color}22;color:${m.color};">${m.short}</div>`;
    html += `</div>`;
  }
  html += `</div></div>`;

  /* 이번 달 마일스톤 */
  for (const m of MILESTONES) {
    const md = new Date(`${m.date}T00:00:00`);
    if (md.getMonth()!==calMonth || md.getFullYear()!==calYear) continue;
    html += `<div class="card" style="border-left:3px solid ${m.color};padding-left:14px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:14px;font-weight:600;">${m.label}</span>
        <span style="font-size:12px;color:${C.muted};">${fmtDate(m.date)}</span>
      </div>
    </div>`;
  }

  /* 범례 */
  html += `<div class="legend">`;
  for (const [bg,c,l] of [["#0A2A18",C.green,"완전 달성"],[C.blue,C.blue,"오늘"],[C.border,C.muted,"미달성"]]) {
    html += `<div class="legend-item"><div class="legend-swatch" style="background:${bg};border:1px solid ${c}44;"></div><span style="font-size:11px;color:${C.muted};">${l}</span></div>`;
  }
  html += `</div>`;
  return html;
}

/* ── RENDER: D-DAY TAB ── */
function renderDday() {
  let html = `<p style="color:${C.muted};font-size:13px;margin:0 0 14px;">확정된 시험·접수일까지 남은 날 · 오늘 기준</p>`;
  for (const m of MILESTONES) {
    const d    = daysUntil(m.date);
    const past = d<0;
    const start= dateNum("2026-06-01");
    const end  = dateNum(m.date);
    const nowT = dateNum(todayStr);
    const bar  = past ? 100 : Math.max(0,Math.min(100,((nowT-start)/(end-start))*100));
    html += `<div class="card" style="border-color:${past?C.border:m.color+"33"};margin-bottom:12px;${past?"opacity:.45;":""}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:${past?0:10}px;">
        <div>
          <p style="margin:0;font-size:15px;font-weight:700;">${m.label}</p>
          <p style="margin:3px 0 0;font-size:12px;color:${C.muted};">${fmtDate(m.date)}</p>
        </div>
        <span style="font-size:30px;font-weight:800;color:${past?C.muted:m.color};line-height:1;">${past?"완료":`D-${d}`}</span>
      </div>
      ${past?"":`<div style="background:${C.border};border-radius:999px;height:4px;overflow:hidden;"><div style="height:100%;width:${bar}%;background:${m.color};border-radius:999px;"></div></div>`}
    </div>`;
  }
  html += `<div class="card">
    <p style="margin:0;font-size:12px;color:${C.muted};line-height:1.9;">
      ⚠️ <strong style="color:${C.text};">날짜 주의</strong><br>
      📌 <strong style="color:${C.amber};">6월 27일 — AICE 시험</strong><br>
      📌 <strong style="color:${C.green};">7월 20일 — 사조분 원서접수 / 8월 7일 — 시험</strong><br>
      하루 3시간은 토익 60분 + 당일 집중 과목 120분으로 고정해요.
    </p>
  </div>`;
  return html;
}

/* ── RENDER: STATS TAB ── */
function renderStats(stats) {
  let html = `<div class="card" style="border-color:${stats.streak>0?"#92400E55":C.border};background:#0F0800;margin-bottom:12px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <span style="font-size:40px;line-height:1;">🔥</span>
      <div>
        <p style="margin:0;font-size:11px;color:#92400E;">연속 달성 스트릭</p>
        <p style="margin:2px 0 0;font-size:34px;font-weight:800;color:${C.amber};line-height:1;">${stats.streak}일</p>
        <p style="margin:3px 0 0;font-size:11px;color:${C.muted};">${stats.streak===0?"오늘 완료하면 스트릭 시작!":stats.todayFull?"오늘 포함":stats.streak+"일 연속 (어제까지 기준)"}</p>
      </div>
    </div>
  </div>`;

  html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <p style="margin:0;font-size:12px;color:${C.muted};">${todayDate.getMonth()+1}월 완전 달성일</p>
      <p style="margin:3px 0 0;font-size:11px;color:${C.muted};">모든 항목 체크 완료한 날</p>
    </div>
    <span style="font-size:36px;font-weight:800;color:${C.blue};">${stats.monthFull}<span style="font-size:14px;color:${C.muted};">일</span></span>
  </div>`;

  html += `<div style="margin-bottom:8px;">
    <div class="eyebrow" style="margin-bottom:10px;"><span style="color:${C.muted};">누적 기록</span><div class="line"></div></div>`;
  const items = [
    {icon:"📘", label:"토익 공부한 날",   value:`${stats.totalToeic}일`, color:CAT_META.toeic.accent,  sub:"매일 60분 고정 루틴 완료"},
    {icon:"📗", label:"사조분 공부한 날", value:`${stats.totalSj}일`,    color:CAT_META.sajobn.accent, sub:"강의·개념·기출 120분 완료"},
    {icon:"📙", label:"AICE 공부한 날",   value:`${stats.totalAice}일`,  color:CAT_META.aice.accent,   sub:"이론·실습·모의 120분 완료"},
    {icon:"⭐", label:"전체 완전 달성일", value:`${stats.totalFull}일`,  color:"#F9A8D4",              sub:"모든 항목 체크 완료"},
  ];
  for (const it of items) {
    html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:22px;line-height:1;">${it.icon}</span>
        <div>
          <p style="margin:0;font-size:13px;color:${C.sub};">${it.label}</p>
          <p style="margin:2px 0 0;font-size:11px;color:${C.muted};">${it.sub}</p>
        </div>
      </div>
      <span style="font-size:24px;font-weight:800;color:${it.color};flex-shrink:0;">${it.value}</span>
    </div>`;
  }
  html += `</div>`;

  const msg = stats.totalFull===0
    ? "💪 오늘부터 시작해요! 매일 두 트랙만 지켜도 8월 시험까지 흐름이 잡힙니다."
    : stats.totalFull<7
    ? `✨ ${stats.totalFull}일 해냈어요. 첫 7일이 가장 어렵습니다. 계속 해봐요.`
    : stats.totalFull<30
    ? `🚀 벌써 ${stats.totalFull}일! 습관이 만들어지고 있어요. 이 페이스 유지하면 돼요.`
    : `🏆 ${stats.totalFull}일 달성! 이 페이스라면 8월 목표까지 충분히 갑니다.`;
  html += `<div class="card" style="border-color:${C.blue}33;background:#0D1B2A;">
    <p style="margin:0;font-size:13px;color:${C.text};line-height:1.8;">${msg}</p>
  </div>`;

  /* 로그아웃 */
  if (state.user) {
    html += `<div style="margin-top:24px;text-align:center;">
      <p style="color:${C.muted};font-size:12px;margin:0 0 8px;">${esc(state.user.displayName || state.user.email || "")} 로그인 중</p>
      <button class="logout-btn" data-act="signout">로그아웃</button>
    </div>`;
  }
  return html;
}

/* ── MAIN RENDER ── */
function render() {
  const app = document.getElementById("app");
  if (state.screen === "loading") { app.innerHTML = renderLoading(); return; }
  if (state.screen === "login")   { app.innerHTML = renderLogin();   return; }

  const merged = mergedDays();
  const stats  = computeStats(merged);

  const viewDate    = state.viewOffset===0 ? todayDate : tomorrowDate;
  const viewChecked = state.viewOffset===0 ? state.checked : state.tomorrowChecked;
  const tasks       = getTasks(viewDate);
  const done        = tasks.filter(t=>viewChecked[t.id]).length;
  const pct         = Math.round((done/tasks.length)*100);
  const phase       = PHASES[viewDate.getMonth()+1] || PHASES[6];
  const view        = {viewDate, viewChecked, tasks, done, phase, isWeekend:isWE(viewDate)};
  const complete    = done===tasks.length;

  let header = `<div class="hdr"><div class="wrap">
    <div class="hdr-top">
      <div>
        <p class="hdr-date">${todayDate.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"})}</p>
        <h1 class="hdr-title">형진의 자격증 플래너</h1>
      </div>
      <div class="hdr-badges">
        ${stats.streak>0?`<div class="badge-streak">🔥 ${stats.streak}일 연속${!stats.todayFull?" (어제 기준)":""}</div>`:""}
        ${stats.next?`<div class="badge-next" style="border:1px solid ${stats.next.color}33;color:${stats.next.color};">${stats.next.short} D-${daysUntil(stats.next.date)}</div>`:""}
      </div>
    </div>
    <div style="margin-bottom:14px;">
      <div class="prog-row">
        <span style="font-size:12px;color:${C.muted};">${state.viewOffset===0?"오늘":"내일"} 달성률</span>
        <span style="font-size:12px;font-weight:700;color:${complete?C.green:C.blue};">${done}/${tasks.length}${complete?" 🎉 완료!":""}</span>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${complete?C.green:"linear-gradient(90deg,#58A6FF,#79C0FF)"};"></div></div>
    </div>
    <div class="tabs">
      ${[["today","오늘"],["calendar","캘린더"],["dday","D-day"],["stats","통계"]].map(([k,l])=>
        `<button class="tabbtn${state.tab===k?" active":""}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}
    </div>
  </div></div>`;

  let body = "";
  if (state.tab==="today")    body = renderToday(stats, view);
  if (state.tab==="calendar") body = renderCalendar(merged);
  if (state.tab==="dday")     body = renderDday();
  if (state.tab==="stats")    body = renderStats(stats);

  app.innerHTML = header + `<div class="body wrap">${body}</div>`;

  const memoEl = document.getElementById("memoInput");
  if (memoEl) memoEl.addEventListener("input", e=>saveMemo(e.target.value));
}

/* ── EVENTS ── */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if      (act==="tab")     { state.tab = el.dataset.tab; render(); }
  else if (act==="offset")  { state.viewOffset = +el.dataset.offset; render(); }
  else if (act==="toggle")  { toggleTask(el.dataset.id); }
  else if (act==="prev")    { state.calMonth===0 ? (state.calMonth=11, state.calYear--) : state.calMonth--; render(); }
  else if (act==="next")    { state.calMonth===11 ? (state.calMonth=0, state.calYear++) : state.calMonth++; render(); }
  else if (act==="signin")  { signIn(); }
  else if (act==="signout") { firebase.auth().signOut(); }
});

/* ── BOOT ── */
if (IS_LOCAL) {
  boot(localAdapter(), null);
} else {
  firebase.initializeApp(firebaseConfig);
  firebase.auth().onAuthStateChanged(u => {
    if (u) { state.screen = "loading"; render(); boot(firestoreAdapter(u.uid), u); }
    else   { state.screen = "login"; state.signingIn = false; render(); }
  });
}
</script>
</body>
</html>
